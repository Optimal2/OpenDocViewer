name: Agent Documentation

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out OpenDocViewer
        uses: actions/checkout@v6
        with:
          path: OpenDocViewer

      # scripts/agent-docs-environment.json is the single pin for Node, the
      # AgentDocMap revision and the collation; the generator re-checks all three.
      - name: Read agent-docs environment pin
        id: pin
        working-directory: OpenDocViewer
        run: |
          pin=scripts/agent-docs-environment.json
          {
            echo "node=$(jq -er '.node' "$pin")"
            echo "agentdocmap-repository=$(jq -er '.agentDocMap.repository' "$pin")"
            echo "agentdocmap-revision=$(jq -er '.agentDocMap.revision' "$pin")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out AgentDocMap
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pin.outputs.agentdocmap-repository }}
          ref: ${{ steps.pin.outputs.agentdocmap-revision }}
          path: AgentDocMap

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.pin.outputs.node }}
          cache: 'npm'
          cache-dependency-path: AgentDocMap/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install AgentDocMap dependencies
        working-directory: AgentDocMap
        run: npm ci --no-audit --fund=false

      - name: Regenerate agent documentation
        working-directory: OpenDocViewer
        run: npm run doc:agent -- --agentdocmap-root ../AgentDocMap

      - name: Verify committed agent documentation is current
        working-directory: OpenDocViewer
        run: git diff --exit-code -- docs-agent
